  or agent card, so nothing here is derived from a contract - every entry below
  is the recorded result of a live probe. Rondo sells industrial heat-battery
  hardware and delivered heat (capital purchase, lease, or heat purchase
  agreement); the marketing site describes "automated AI patented controls" on
  the Rondo Heat Battery but publishes no interface, telemetry schema, or
  integration documentation for them. The only authenticated surfaces on the
  domain are portal.rondo.com (a Jetty session portal) and login.rondo.com (an
  Okta custom domain whose TLS certificate does not match the host).
