aid: rondo-energy
name: Rondo Energy
description: 'Rondo Energy is an Alameda, California industrial decarbonization company
  led by CEO John O''Donnell that builds the Rondo Heat Battery (RHB), a thermal energy
  storage system that converts intermittent wind and solar electricity into heat stored
  in thousands of tons of refractory brick at temperatures up to 1,500C and returns
  it as continuous steam, thermal oil, superheated air, or combined heat and power
  at rated outputs from 2MWth to over 100MWth. The RHB is sold as a drop-in replacement
  for a fossil-fuel boiler, via capital purchase, lease, or heat purchase agreement,
  into cement, food and beverage, chemicals, fuels and ethanol, textiles, pulp and
  paper, mining, pharmaceuticals, and direct air capture. Rondo operates the world''s
  largest industrial heat battery and has announced a 90GWh factory plan with Siam
  Cement Group, backed by Breakthrough Energy Ventures and Catalyst, Energy Impact
  Partners, Microsoft''s Climate Innovation Fund, Rio Tinto, SABIC, Aramco Ventures,
  and the European Investment Bank. Rondo sells hardware and delivered heat, not software:
  it publishes no developer portal, API reference, or machine-readable specification.'
